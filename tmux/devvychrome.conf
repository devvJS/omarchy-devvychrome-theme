# Devvychrome tmux theme
#
# Sourced from ~/.config/tmux/tmux.conf via:
#   source-file ~/.config/tmux/devvychrome.conf
#
# Uses explicit hex values from the Devvychrome palette rather than ANSI
# color names, so the status bar renders correctly over SSH or in any
# terminal that does not load the Devvychrome terminal palette.
#
# Palette mapping:
#   bg3  = #222222   status bar background (matches Waybar bg)
#   fg   = #6a6a6a   idle text    (matches Waybar fg)
#   acc  = #9a9a9a   active/accent (matches Waybar border-active logic)
#   bg0  = #161616   base background
#   bg5  = #3a3a3a   selection / copy-mode

# ── Status bar ─────────────────────────────────────────────────────
set -g status-style          "bg=#222222,fg=#6a6a6a"
set -g status-left-length    30
set -g status-right-length   50

# Session name — inverted accent block (matches Waybar's active module style)
set -g status-left  "#[fg=#161616,bg=#9a9a9a,bold] #S #[bg=#222222,fg=#9a9a9a] "

# Right side: mode flags + hostname
set -g status-right "#[fg=#9a9a9a]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#3a3a3a]#h "

# ── Window list ────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-format         "#[fg=#3a3a3a] #I:#W "
set -g window-status-current-format "#[fg=#9a9a9a,bold] #I:#W "

# ── Pane borders ───────────────────────────────────────────────────
set -g pane-border-style        "fg=#2a2a2a"
set -g pane-active-border-style "fg=#9a9a9a"

# ── Messages ───────────────────────────────────────────────────────
set -g message-style         "bg=#222222,fg=#9a9a9a"
set -g message-command-style "bg=#222222,fg=#9a9a9a"

# ── Copy mode ──────────────────────────────────────────────────────
set -g mode-style "bg=#3a3a3a,fg=#e0e0e0"

# ── Clock ──────────────────────────────────────────────────────────
setw -g clock-mode-colour "#9a9a9a"
